[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protein-vis"
version = "0.1.0"
description = "Reusable PyMOL scenes and research figures from TOML specifications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pillow>=10",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
render = ["pymol-open-source==3.2.0a0"]

[project.scripts]
protein-vis = "protein_vis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_vis"]
